<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Your Name | Accessible Web Developer Portfolio</title>

  <meta
    name="description"
    content="Personal portfolio of Your Name, a web developer creating accessible, semantic, responsive, and user-friendly websites."
  >

  <meta name="author" content="Your Name">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#0b3d91">

  <!-- Open Graph / Social Sharing -->
  <meta property="og:title" content="Your Name | Web Developer Portfolio">
  <meta
    property="og:description"
    content="Explore my accessible web development portfolio, skills, projects, and contact information."
  >
  <meta property="og:type" content="website">

  <style>
    /* ================================
       RESET & BASE STYLES
    ================================= */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      font-size: 1rem;
      line-height: 1.6;
      color: #17202a;
      background-color: #ffffff;
    }

    img {
      max-width: 100%;
      height: auto;
    }

    a {
      color: #0645ad;
    }

    a:hover {
      color: #032f75;
    }

    a:focus-visible,
    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: 3px solid #ffbf47;
      outline-offset: 3px;
    }

    /* ================================
       ACCESSIBILITY
    ================================= */

    .skip-link {
      position: absolute;
      top: -100px;
      left: 1rem;
      z-index: 9999;
      padding: 0.75rem 1rem;
      color: #ffffff;
      background-color: #000000;
      text-decoration: none;
      font-weight: bold;
    }

    .skip-link:focus {
      top: 1rem;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ================================
       LAYOUT
    ================================= */

    .container {
      width: min(92%, 1100px);
      margin-inline: auto;
    }

    section {
      padding: 4rem 0;
    }

    h1,
    h2,
    h3 {
      line-height: 1.2;
      margin-top: 0;
    }

    h1 {
      font-size: clamp(2.5rem, 7vw, 4.5rem);
    }

    h2 {
      font-size: clamp(2rem, 5vw, 3rem);
      margin-bottom: 1.5rem;
    }

    h3 {
      font-size: 1.5rem;
    }

    p {
      max-width: 70ch;
    }

    /* ================================
       HEADER
    ================================= */

    header.site-header {
      background-color: #0b3d91;
      color: #ffffff;
      border-bottom: 4px solid #06275c;
    }

    .header-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      padding: 1rem 0;
    }

    .logo {
      color: #ffffff;
      font-size: 1.5rem;
      font-weight: bold;
      text-decoration: none;
      white-space: nowrap;
    }

    .logo:hover {
      color: #ffffff;
    }

    /* ================================
       NAVIGATION
    ================================= */

    nav ul {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    nav a {
      display: inline-block;
      padding: 0.6rem 0.8rem;
      color: #ffffff;
      font-weight: bold;
      text-decoration: none;
      border-radius: 4px;
    }

    nav a:hover,
    nav a[aria-current="page"] {
      background-color: #ffffff;
      color: #0b3d91;
    }

    /* ================================
       HERO
    ================================= */

    .hero {
      padding: 6rem 0;
      color: #ffffff;
      background-color: #0b3d91;
    }

    .hero .eyebrow {
      margin-bottom: 0.5rem;
      color: #dbeafe;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .hero h1 {
      margin-bottom: 1.5rem;
    }

    .hero p {
      font-size: 1.2rem;
    }

    /* ================================
       BUTTONS
    ================================= */

    .button {
      display: inline
